<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Log</title>
</head>
<body>
      <header>
        <div class="logo-container">
            <h1><a href="index.html" class="works-title">J.Dev</a></h1>
            
        </div>
        <nav>
            <a href="art.html" class="button-link">Art</a>
            <a href="works.html" class="button-link">Works</a>
            <a href="snailmail.html" class="button-link">Snail Mail</a>
        </nav> 
    </header> 
    <main class="paper container">
        <p class="lede">A quiet place to keep track of what I am making, thinking about, and carrying forward.</p>

        <div id="password-section" class="password-section">
            <label>
                Enter password
                <input type="password" id="log-password" placeholder="Password">
            </label>
            <button id="password-submit" class="cta">Unlock</button>
            <p id="password-message" style="color:crimson; display:none; margin-top:0.5rem;"></p>
        </div>

        <form id="log-form" class="log-form" style="display:none;">
            <label>
                Date
                <input type="date" id="log-date" required>
            </label>
            <label>
                Headline
                <input type="text" id="log-headline" placeholder="What I am working on right now" required>
            </label>
            <label>
                Notes or musings
                <textarea id="log-notes" rows="6" placeholder="Write your thoughts here..." required></textarea>
            </label>
            <button type="submit" class="cta">Add section</button>
        </form>

        <section id="log-list" class="log-list">
            <article class="log-entry">
                <p class="log-date">August 4, 2026</p>
                <h2 class="headline">Building a calmer online space</h2>
                <div class="log-notes">
                    <p>Today I am shaping this log into a place for small updates, reflections, and loose ideas.</p>
                </div>
            </article>
        </section>
        

    
    
    </main>
    <script>
        // Password (case-sensitive) required to reveal the form
        const PASSWORD = 'ng4h3r3';

        const passwordSection = document.getElementById('password-section');
        const passwordInput = document.getElementById('log-password');
        const passwordSubmit = document.getElementById('password-submit');
        const passwordMessage = document.getElementById('password-message');

        const form = document.getElementById('log-form');
        const dateInput = document.getElementById('log-date');
        const headlineInput = document.getElementById('log-headline');
        const notesInput = document.getElementById('log-notes');
        const logList = document.getElementById('log-list');

        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        function showForm() {
            passwordSection.style.display = 'none';
            form.style.display = '';
            passwordMessage.style.display = 'none';
            headlineInput.focus();
        }

        function showError(msg) {
            passwordMessage.textContent = msg;
            passwordMessage.style.display = 'block';
        }

        passwordSubmit.addEventListener('click', function (e) {
            e.preventDefault();
            const attempt = passwordInput.value || '';
            if (attempt === PASSWORD) {
                showForm();
                // clear password for privacy
                passwordInput.value = '';
            } else {
                showError('Incorrect password.');
            }
        });

        // allow pressing Enter while focused in password field
        passwordInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordSubmit.click();
            }
        });

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const dateValue = dateInput.value || today;
            const headlineValue = headlineInput.value.trim();
            const notesValue = notesInput.value.trim();

            if (!headlineValue || !notesValue) {
                return;
            }

            const article = document.createElement('article');
            article.className = 'log-entry';

            const formattedDate = new Date(dateValue + 'T00:00:00').toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });

            article.innerHTML = `
                <p class="log-date">${formattedDate}</p>
                <h2 class="headline">${headlineValue}</h2>
                <div class="log-notes">
                    <p>${notesValue.replace(/\n/g, '<br>')}</p>
                </div>
            `;

            logList.prepend(article);
            form.reset();
            dateInput.value = today;
            headlineInput.focus();
        });
    </script>
</body>
</html>
